# Tipos de inimigo.
#
#   mark           caractere que marca o ponto de nascimento no mapa (data/maps/*.txt)
#   hp, speed      vida e velocidade
#   aggro_radius   distância em que começa a perseguir um jogador
#   leash          distância máxima de casa antes de desistir
#   wander_radius  raio de passeio em volta de casa quando não tem alvo
#   respawn        segundos até renascer depois de morto
#   kill_xp        XP de bônus para quem mata (vai para o atributo principal da skill usada)
#   skills         skills que a IA usa (melee, projectile, area, self)
#   color          cor do corpo no cliente
#   gold           moedas que caem: N ou [mínimo, máximo]
#   loot           itens que podem cair (items.yaml), cada um sorteado separadamente:
#                    - { item: id, chance: 0.25, qty: [1, 2] }   (chance 0–1; qty N ou [mín, máx])
#   level          nível mostrado ao jogador (comparável ao nível dos atributos; padrão 1).
#                  A ferramenta de balanceamento testa cada inimigo nesse nível.
#   damage         multiplica o dano das skills (padrão 1): reaproveita skills em inimigos mais fortes
#   size           tamanho do corpo (padrão 1 = igual a um jogador): colisão, alcance e desenho
#   elite_chance   chance de nascer elite (0–1): vida, dano, tamanho, XP, moedas e saque maiores
#                  (multiplicadores ELITE_* em server/config.py)
#   boss           true = chefe: barra de vida no topo da tela, avisa quem está perto, volta
#                  inteiro (e para a primeira fase) se a luta se afastar demais de casa (leash)
#   phases         só chefes. Cada fase começa quando a vida cai até hp_below (fração):
#                    - hp_below: 0.5
#                      message: texto para quem está perto
#                      skills: [ ... ]        troca as skills (opcional)
#                      damage: 1.2            multiplica o dano a partir daqui (opcional)
#                      speed: 1.2             multiplica a velocidade (opcional)
#                      effects: [ { id: furia, duration: 999 } ]   no próprio chefe (opcional)
#                      summon: [ { enemy: id, count: 2 } ]       invocados não renascem
#
# O saque cai no chão: quem matou tem alguns segundos de exclusividade para pegar
# (passando por cima); depois qualquer um pega, até sumir.

