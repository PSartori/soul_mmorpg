# Zonas do mapa inicio.txt.
#
# Tipos:
#   safe  zona segura: ninguém ataca jogadores e inimigos não entram.
#         Vem dos tiles ':' do mapa (não dá para declarar aqui).
#   pve   inimigos atacam jogadores; jogadores não se atacam (só em duelo).
#   pvp   vale tudo: jogadores podem se atacar livremente.
#
#   default_zone  zona de todo lugar que não é ':' nem está numa área abaixo
#   zones         áreas retangulares, em tiles: area: [x0, y0, x1, y1] (cantos inclusive;
#                 coluna x, linha y, contando do 0 no canto superior esquerdo do .txt,
#                 sem contar as linhas de comentário). A primeira área que contém o ponto vence.
#
#   name          nome do mapa exibido no jogo
#   portals       áreas que levam a outro mapa: quem pisa aparece no tile "at" do mapa "to"
#                   - { area: [x0, y0, x1, y1], to: outro_mapa, at: [x, y] }
#                 (o servidor confere se o mapa existe e se o tile de chegada é livre)
#   npcs          onde ficam os personagens do mundo (data/npcs.yaml), em tiles:
#                   - { id: mercadora, at: [x, y] }
#
# Duelos (/duelo Nome) valem em qualquer zona, inclusive na segura.

name: Campos de Início

default_zone: { type: pve, name: Campos }

portals:
  - { area: [37, 1, 38, 2], to: bosque, at: [4, 3] }

zones:
  arena:
    name: Ermo do Sudeste
    type: pvp
    area: [25, 17, 38, 28]

npcs:
  - { id: mercadora, at: [2, 2] }
  - { id: ferreiro, at: [8, 2] }
  - { id: ancia, at: [3, 6] }
