# Skills (técnicas). Usadas por jogadores e por inimigos.
#
# Campos comuns:
#   name          nome exibido
#   type          melee | projectile | area | dash | self
#   cooldown      segundos até poder usar de novo
#   cost          { energy: N }
#   damage        { base: N, scale: { atributo: N por nível } }
#                 dano = (base + soma de scale × nível) × modificador "damage" de quem usa
#   train         { atributo: XP } ganho por alvo atingido (dash/self: por uso)
#   effects       [ { id: efeito, duration: segundos } ] aplicados em quem é atingido
#   self_effects  [ { id: efeito, duration: segundos } ] aplicados em quem usa
#   color         cor do efeito visual no cliente
#
# Campos por tipo:
#   melee       reach (distância do centro do golpe), size (metade do lado da área)
#   projectile  speed, ttl (segundos de vida), radius, count (quantos), spread (graus entre eles)
#   area        radius (em volta de quem usa)
#   dash        distance (avanço na direção em que olha)
#   self        (nenhum: só self_effects)
#
# Atributos: strength, spirit, agility, vitality

